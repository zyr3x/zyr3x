<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="100%" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0b18" />
      <stop offset="50%" stop-color="#160c2b" />
      <stop offset="100%" stop-color="#0a0814" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241442" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#140a28" stop-opacity="0.9" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <!-- Text Purple Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #a855f7; letter-spacing: 2px; text-transform: uppercase; }
    .metric-value { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 28px; font-weight: 800; fill: url(#textGrad); }
    .metric-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #f1f5f9; }
    .metric-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 400; fill: #94a3b8; }
    .dot { fill: #a855f7; }
  </style>

  <!-- Outer Container -->
  <rect x="2" y="2" width="836" height="216" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Header Section -->
  <circle cx="28" cy="28" r="4" class="dot" />
  <text x="40" y="32" class="title">Engineering Impact &amp; Activity Overview</text>
  <text x="800" y="32" text-anchor="end" class="metric-sub">Verified GitHub &amp; Enterprise Metrics</text>

  <!-- Divider Line -->
  <line x1="24" y1="46" x2="816" y2="46" stroke="#3b1d6e" stroke-width="1" />

  <!-- Metric Card 1: Contributions -->
  <g transform="translate(24, 60)">
    <rect width="186" height="136" rx="12" fill="url(#cardGrad)" stroke="#4c1d95" stroke-width="1" />
    <text x="18" y="44" class="metric-value">3,200+</text>
    <text x="18" y="74" class="metric-label">Contributions / Year</text>
    <text x="18" y="96" class="metric-sub">High-velocity commits</text>
    <text x="18" y="114" class="metric-sub">&amp; system architecture</text>
  </g>

  <!-- Metric Card 2: Experience -->
  <g transform="translate(224, 60)">
    <rect width="186" height="136" rx="12" fill="url(#cardGrad)" stroke="#4c1d95" stroke-width="1" />
    <text x="18" y="44" class="metric-value">15+ Yrs</text>
    <text x="18" y="74" class="metric-label">Enterprise eCommerce</text>
    <text x="18" y="96" class="metric-sub">Scalable architectures &amp;</text>
    <text x="18" y="114" class="metric-sub">high-load optimization</text>
  </g>

  <!-- Metric Card 3: Repositories -->
  <g transform="translate(424, 60)">
    <rect width="186" height="136" rx="12" fill="url(#cardGrad)" stroke="#4c1d95" stroke-width="1" />
    <text x="18" y="44" class="metric-value">75+</text>
    <text x="18" y="74" class="metric-label">Repositories Built</text>
    <text x="18" y="96" class="metric-sub">Open-source tooling,</text>
    <text x="18" y="114" class="metric-sub">APIs &amp; core platforms</text>
  </g>

  <!-- Metric Card 4: AI & Agentic Systems -->
  <g transform="translate(624, 60)">
    <rect width="192" height="136" rx="12" fill="url(#cardGrad)" stroke="#4c1d95" stroke-width="1" />
    <text x="18" y="44" class="metric-value">AI Agents</text>
    <text x="18" y="74" class="metric-label">Multi-Agent &amp; MCP</text>
    <text x="18" y="96" class="metric-sub">Autonomous toolchains</text>
    <text x="18" y="114" class="metric-sub">&amp; LLM proxy engineering</text>
  </g>
</svg>
